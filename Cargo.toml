[package]
name = "arcli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
walkdir = "2"
anyhow = "1"
git2 = "0.19"
ctrlc = "3"
tempfile = "3"
libc = "0.2"
